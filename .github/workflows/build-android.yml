name: Build DriveFly Android

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK components
        run: |
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdk_manager" --licenses > /dev/null
          set -o pipefail
          "$sdk_manager" "platforms;android-36" "build-tools;36.0.0"
      - name: Test and build Android app
        run: bash gradlew --no-daemon testDebugUnitTest assembleDebug compileDebugAndroidTestKotlin
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: DriveFly-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DriveFly-Android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
